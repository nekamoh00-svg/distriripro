.low{color:var(--dg);font-weight:700}.kp{display:flex;gap:10px;flex-wrap:wrap}.kp div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.kp b{font-size:22px;display:block}

<nav id="nav"></nav><main id="m"></main>
<script>
const T={fr:{dash:"Tableau de bord",stock:"Stock",clients:"Clients",sellers:"Vendeurs",orders:"Bons de commande",invoices:"Factures",loads:"Chargement camion",sync:"Synchronisation",settings:"Paramètres",name:"Nom",phone:"Téléphone",addr:"Adresse",truck:"Camion",qty:"Qté",price:"Prix",min:"Seuil",add:"Ajouter",del:"Suppr.",product:"Produit",client:"Client",seller:"Vendeur",date:"Date",total:"Total",tax:"TVA %",cur:"Devise",company:"Société",lang:"Langue",save:"Enregistrer",line:"Ajouter ligne",create:"Créer",invoice:"Facturer",view:"Voir",print:"Imprimer",close:"Fermer",low:"Stock bas",validate:"Valider le chargement (déduit le stock)",status:"Statut",paid:"Payée",pay:"Encaisser",export:"Exporter les données",import:"Importer / fusionner",last:"Dernière synchro",nodata:"Aucune donnée",ht:"Sous-total",ttc:"Total TTC",dl:"Bon de chargement",po:"Bon de commande",inv:"Facture",sig:"Signature",nostock:"Stock insuffisant pour",ok:"Effectué",syncnote:"Copiez le JSON pour transférer vers un autre appareil, ou collez-le puis importez (fusion par date la plus récente).",nb:"N°"},
en:{dash:"Dashboard",stock:"Stock",clients:"Clients",sellers:"Sellers",orders:"Purchase orders",invoices:"Invoices",loads:"Truck loading",sync:"Synchronization",settings:"Settings",name:"Name",phone:"Phone",addr:"Address",truck:"Truck",qty:"Qty",price:"Price",min:"Threshold",add:"Add",del:"Del.",product:"Product",client:"Client",seller:"Seller",date:"Date",total:"Total",tax:"VAT %",cur:"Currency",company:"Company",lang:"Language",save:"Save",line:"Add line",create:"Create",invoice:"Invoice",view:"View",print:"Print",close:"Close",low:"Low stock",validate:"Validate loading (deducts stock)",status:"Status",paid:"Paid",pay:"Mark paid",export:"Export data",import:"Import / merge",last:"Last sync",nodata:"No data",ht:"Subtotal",ttc:"Total incl. tax",dl:"Loading slip",po:"Purchase order",inv:"Invoice",sig:"Signature",nostock:"Not enough stock for",ok:"Done",syncnote:"Copy the JSON to move data to another device, or paste it and import (merged by most recent date).",nb:"No."},
ar:{dash:"لوحة القيادة",stock:"المخزون",clients:"الزبائن",sellers:"البائعون",orders:"سندات الطلب",invoices:"الفواتير",loads:"تحميل الشاحنة",sync:"المزامنة",settings:"الإعدادات",name:"الاسم",phone:"الهاتف",addr:"العنوان",truck:"الشاحنة",qty:"الكمية",price:"السعر",min:"الحد الأدنى",add:"إضافة",del:"حذف",product:"المنتج",client:"الزبون",seller:"البائع",date:"التاريخ",total:"المجموع",tax:"الضريبة %",cur:"العملة",company:"الشركة",lang:"اللغة",save:"حفظ",line:"إضافة سطر",create:"إنشاء",invoice:"فوترة",view:"عرض",print:"طباعة",close:"إغلاق",low:"مخزون منخفض",validate:"تأكيد التحميل (خصم المخزون)",status:"الحالة",paid:"مدفوعة",pay:"تسديد",export:"تصدير البيانات",import:"استيراد / دمج",last:"آخر مزامنة",nodata:"لا بيانات",ht:"المجموع الجزئي",ttc:"الإجمالي مع الضريبة",dl:"سند التحميل",po:"سند الطلب",inv:"فاتورة",sig:"التوقيع",nostock:"مخزون غير كاف لـ",ok:"تم",syncnote:"انسخ JSON لنقل البيانات إلى جهاز آخر، أو الصقه ثم استورده (دمج حسب الأحدث).",nb:"رقم"}};
const K='distripro_v1';
let db={products:[],clients:[],sellers:[],orders:[],loads:[],settings:{company:"Ma Société",cur:"DA",tax:19,lang:"fr"},ts:0,sync:0};
try{const s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
let tab='dash',draft=[],doc=null;
const t=k=>T[LG()][k]||k,$=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>(+n||0).toFixed(2)+' '+db.settings.cur;
function save(){db.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
const P=id=>db.products.find(x=>x.id==id)||{name:'?',price:0},C=id=>(db.clients.find(x=>x.id==id)||{name:'?'}),S=id=>(db.sellers.find(x=>x.id==id)||{name:'?'});
const sub=l=>l.reduce((a,x)=>a+x.q*x.pr,0),ttc=o=>sub(o.lines)*(1-(o.disc||0)/100)*(1+db.settings.tax/100);
const opts=(a)=>a.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
const inp=(id,l,ty='text',v='')=>`<label>${t(l)}<input id="${id}" type="${ty}" value="${v}"></label>`;
const table=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')||`<tr><td>${t('nodata')}</td></tr>`}</table></div>`;
const v=id=>$(id).value.trim();
function go(x){tab=x;doc=null;draft=[];render()}
function render(){
 document.documentElement.lang=LG();document.documentElement.dir=LG()=='ar'?'rtl':'ltr';
 $('co').textContent=db.settings.company;
 const tabs=['dash','stock','clients','sellers','orders','invoices','loads','sync','settings'];
 $('nav').innerHTML=tabs.map(x=>`<button class="${x==tab?'on':''}" onclick="go('${x}')">${t(x)}</button>`).join('');
 $('m').innerHTML=doc?docView():views[tab]();
}
const views={
dash(){const low=db.products.filter(p=>p.qty<=p.min).length,rev=db.orders.filter(o=>o.inv).reduce((a,o)=>a+ttc(o),0);
 return `<div class="kp"><div><span>${t('stock')}</span><b>${db.products.length}</b></div><div><span>${t('low')}</span><b class="${low?'low':''}">${low}</b></div><div><span>${t('clients')}</span><b>${db.clients.length}</b></div><div><span>${t('orders')}</span><b>${db.orders.length}</b></div><div><span>${t('invoices')}</span><b>${money(rev)}</b></div></div>`},
stock(){return `<div class="card"><div class="row">${inp('n','name')}${inp('sk','product')}${inp('q','qty','number')}${inp('p','price','number')}${inp('mn','min','number','10')}<button class="b" onclick="addP()">${t('add')}</button></div></div><div class="card">${table([t('name'),t('qty'),t('price'),t('min'),''],db.products.map(p=>`<tr><td>${p.name}</td><td class="${p.qty<=p.min?'low':''}">${p.qty}</td><td>${money(p.price)}</td><td>${p.min}</td><td><button class="s" onclick="del('products','${p.id}')">${t('del')}</button></td></tr>`))}</div>`},
clients(){return simple('clients',['name','phone','addr'])},
sellers(){return simple('sellers',['name','phone','truck'])},
orders(){return `<div class="card"><div class="row"><label>${t('client')}<select id="oc">${opts(db.clients)}</select></label><label>${t('seller')}<select id="os">${opts(db.sellers).replace('value="'+((me()||{}).sid)+'"','value="'+((me()||{}).sid)+'" selected')}</select></label>${inp('od','disc','number','0')}${inp('dd','deldate','date',today())}<label>${t('driver')}<select id="dr"><option value="">—</option>${opts(db.users.filter(u=>u.role=='driver'))}</select></label>${inp('nt','ordnote')}${lineEd()}<button class="b" onclick="addO()">${t('create')}</button></div>${draftT()}</div><div class="card">${table(['N°',t('client'),t('seller'),t('date'),t('status'),t('total'),''],db.orders.filter(o=>role!='seller_r'||!(me()||{}).sid||o.s==me().sid).map(o=>`<tr><td>${o.no}</td><td>${C(o.c).name}</td><td>${S(o.s).name}</td><td>${o.d}</td><td>${stB(o)}</td><td>${money(ttc(o))}</td><td><button class="s" onclick="show('o','${o.id}')">${t('view')}</button> ${o.inv?'':`<button class="s" onclick="invoice('${o.id}')">${t('invoice')}</button>`}</td></tr>`))}</div>`},
invoices(){return `<div class="card">${table(['N°',t('client'),t('date'),t('total'),t('status'),''],db.orders.filter(o=>o.inv).map(o=>`<tr><td>F-${o.no}</td><td>${C(o.c).name}</td><td>${o.d}</td><td>${money(ttc(o))}</td><td>${o.paid?'✅ '+t('paid'):'⏳'}</td><td><button class="s" onclick="show('i','${o.id}')">${t('view')}</button> ${o.paid?'':`<button class="s" onclick="pay('${o.id}')">${t('pay')}</button>`}</td></tr>`))}</div>`},
loads(){return `<div class="card"><div class="row"><label>${t('seller')}<select id="ls">${opts(db.sellers)}</select></label>${lineEd()}<button class="b" onclick="addL()">${t('validate')}</button></div>${draftT()}</div><div class="card">${table(['N°',t('seller'),t('truck'),t('date'),t('qty'),''],db.loads.map(l=>`<tr><td>${l.no}</td><td>${S(l.s).name}</td><td>${S(l.s).truck||''}</td><td>${l.d}</td><td>${l.lines.reduce((a,x)=>a+x.q,0)}</td><td><button class="s" onclick="show('l','${l.id}')">${t('view')}</button></td></tr>`))}</div>`},
sync(){return `<div class="card"><p>${t('syncnote')}</p><p>${t('last')}: ${db.sync?new Date(db.sync).toLocaleString():'—'}</p><textarea id="js" rows="8" style="width:100%">${JSON.stringify(db)}</textarea><div class="row" style="margin-top:8px"><button class="b" onclick="$('js').value=JSON.stringify(db);$('js').select();document.execCommand('copy')">${t('export')}</button><button class="b" onclick="imp()">${t('import')}</button></div></div>`},
settings(){const s=db.settings;return `<div class="card"><div class="row">${inp('sc','company','text',s.company)}${inp('sy','cur','text',s.cur)}${inp('st','tax','number',s.tax)}<label>${t('lang')}<select id="sl"><option value="fr" ${LG()=='fr'?'selected':''}>Français</option><option value="en" ${LG()=='en'?'selected':''}>English</option><option value="ar" ${LG()=='ar'?'selected':''}>العربية</option></select></label><button class="b" onclick="setS()">${t('save')}</button></div></div>`}};
setTimeout(()=>{},0);
function simple(k,f){return `<div class="card"><div class="row">${f.map(x=>inp('f_'+x,x)).join('')}<button class="b" onclick="addS('${k}',${JSON.stringify(f).replace(/"/g,"'")})">${t('add')}</button></div></div><div class="card">${table(f.map(t).concat(['']),db[k].map(r=>`<tr>${f.map(x=>`<td>${r[x]||''}</td>`).join('')}<td><button class="s" onclick="del('${k}','${r.id}')">${t('del')}</button></td></tr>`))}</div>`}
function lineEd(){return `<label>${t('product')}<select id="lp">${opts(db.products)}</select></label>${inp('lq','qty','number','1')}<button class="s" onclick="addLine()">${t('line')}</button>`}
function draftT(){return draft.length?table([t('product'),t('qty'),t('price')],draft.map(x=>`<tr><td>${P(x.p).name}${x.u=='c'?' ['+t('carton')+']':''}</td><td>${fq(x.p,x.q)}</td><td>${money(x.pr)}</td></tr>`)):''}
function addLine(){const p=P($('lp').value),q=+$('lq').value;if(!p.id||q<=0)return;draft.push({p:p.id,q,pr:p.price});render()}
function addP(){if(!v('n'))return;db.products.push({id:uid(),name:v('n'),qty:+v('q')||0,price:+v('p')||0,min:+v('mn')||0});save();render()}
function addS(k,f){const r={id:uid()};f.forEach(x=>r[x]=v('f_'+x));if(!r.name)return;db[k].push(r);save();render()}
function del(k,id){db[k]=db[k].filter(x=>x.id!=id);save();render()}
const today=()=>new Date().toISOString().slice(0,10);
function addO(){if(!draft.length||!db.clients.length||!db.sellers.length)return;db.orders.push({id:uid(),no:'BC-'+String(db.orders.length+1).padStart(4,'0'),c:v('oc'),s:v('os'),d:today(),lines:draft});draft=[];save();render()}
function invoice(id){db.orders.find(o=>o.id==id).inv=1;save();render()}
function pay(id){db.orders.find(o=>o.id==id).paid=1;save();render()}
function addL(){if(!draft.length||!db.sellers.length)return;
 for(const x of draft){const p=db.products.find(z=>z.id==x.p);if(p.qty<x.q)return alert(t('nostock')+' '+p.name)}
 draft.forEach(x=>db.products.find(z=>z.id==x.p).qty-=x.q);
 db.loads.push({id:uid(),no:'BL-'+String(db.loads.length+1).padStart(4,'0'),s:v('ls'),d:today(),lines:draft});draft=[];save();render()}
function show(ty,id){doc={ty,id};render()}
function docView(){const{ty,id}=doc,s=db.settings;let r,no,who,title;
 if(ty=='l'){r=db.loads.find(x=>x.id==id);no=r.no;who=r.drv?`${t('driver')}: ${(db.users.find(x=>x.id==r.drv)||{}).name||'?'} — ${t('truck')}: ${(db.users.find(x=>x.id==r.drv)||{}).truck||''}${r.ords?'<br>'+t('orders')+': '+r.ords.map(i=>(db.orders.find(o=>o.id==i)||{}).no).join(', '):''}`:`${t('seller')}: ${S(r.s).name} — ${t('truck')}: ${S(r.s).truck||''}`;title=t('dl')}
 else{r=db.orders.find(x=>x.id==id);no=(ty=='i'?'F-':'')+r.no;who=`${t('client')}: ${C(r.c).name} — ${t('seller')}: ${S(r.s).name}`;title=ty=='i'?t('inv'):t('po')}
 const tot=ty!='l'?`<p style="text-align:end">${t('ht')}: ${money(sub(r.lines))}<br>${r.disc?t('disc')+': '+r.disc+'%<br>':''}${t('tax')}: ${s.tax}%<br><b>${t('ttc')}: ${money(ttc(r))}</b></p>`:'';
 const rows=r.lines.map(x=>`<tr><td>${P(x.p).name}</td><td>${x.q}</td>${ty!='l'?`<td>${money(x.pr)}</td><td>${money(x.q*x.pr)}</td>`:''}</tr>`).join('');
 return `<div class="np row" style="margin-bottom:10px"><button class="b" onclick="window.print()">${t('print')}</button><button class="s" onclick="doc=null;render()">${t('close')}</button></div><div id="doc"><h2>${s.company}</h2>${s.addr||s.tel||s.nif?`<div style="font-size:12px">${[s.addr,s.tel,s.nif&&('NIF: '+s.nif)].filter(Boolean).map(esc).join(' · ')}</div>`:''}<h3>${title} ${t('nb')} ${no}</h3><p>${t('date')}: ${r.d}<br>${who}</p><div class="tw"><table><tr><th>${t('product')}</th><th>${t('qty')}</th>${ty!='l'?`<th>${t('price')}</th><th>${t('total')}</th>`:''}</tr>${rows}</table></div>${tot}<p style="margin-top:40px">${t('sig')}: ________________</p>${s.foot?`<p style="font-size:12px;text-align:center">${esc(s.foot)}</p>`:''}</div>`}
function setS(){db.settings={company:v('sc'),cur:v('sy'),tax:+v('st')||0,lang:$('sl').value};save();render()}
function imp(){try{const o=JSON.parse($('js').value);const m=(a,b)=>{const map=new Map();[...a,...b].forEach(x=>map.set(x.id,Object.assign(map.get(x.id)||{},x)));return[...map.values()]};
 ['products','clients','sellers','orders','loads'].forEach(k=>db[k]=m(db[k],o[k]||[]));
 if(o.ts>db.ts&&o.settings)db.settings=o.settings;db.sync=Date.now();save();alert(t('ok'));render()}catch(e){alert('JSON invalide')}}

Object.assign(T.fr,{disc:"Remise %",edit:"Modifier",cancel:"Annuler",search:"Rechercher…",due:"Reste dû",top:"Produits les plus vendus",cloudon:"Synchronisation cloud active : les données sont partagées en temps réel entre appareils.",cloudoff:"Cloud indisponible : mode local (utilisez l'export JSON).",topay:"Montant"});
Object.assign(T.en,{disc:"Discount %",edit:"Edit",cancel:"Cancel",search:"Search…",due:"Balance due",top:"Best-selling products",cloudon:"Cloud sync active: data is shared in real time across devices.",cloudoff:"Cloud unavailable: local mode (use JSON export).",topay:"Amount"});
Object.assign(T.ar,{disc:"خصم %",edit:"تعديل",cancel:"إلغاء",search:"بحث…",due:"المتبقي",top:"الأكثر مبيعا",cloudon:"المزامنة السحابية مفعلة: البيانات مشتركة لحظيا بين الأجهزة.",cloudoff:"السحابة غير متاحة: وضع محلي (استخدم تصدير JSON).",topay:"المبلغ"});
let ed=null,q='',cloud=null;const COLS=['products','clients','sellers','orders','loads'],sent={};
const edRec=k=>ed&&ed.k==k?(db[k].find(x=>x.id==ed.id)||{}):{};
const paidAmt=o=>Math.min(ttc(o),(o.paid?ttc(o):(o.pays||[]).reduce((a,x)=>a+x.a,0))+credit(o));
const srch=()=>'';
const hit=r=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase());
function go(x){tab=x;doc=null;draft=[];ed=null;q='';render()}
function rerender(){const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()}
